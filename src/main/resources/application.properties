spring.application.name=fastfood
spring.datasource.url=jdbc:postgresql://localhost:5432/fast_food
spring.datasource.username=fastfood
spring.datasource.password=fastfood
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Without this, Lettuce's default command timeout is 60s — meaning a
# request would just hang for a full minute before our CacheErrorHandler
# ever gets a chance to fall back to Postgres. 1s is generous for a
# local/same-network Redis; tune this down further in production.
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s