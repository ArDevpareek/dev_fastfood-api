spring.application.name=fastfood
spring.datasource.url=jdbc:postgresql://localhost:5432/fast_food
spring.datasource.username=fastfood
spring.datasource.password=fastfood
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Without this, Lettuce's default command timeout is 60s — meaning a
# request would just hang for a full minute before our CacheErrorHandler
# ever gets a chance to fall back to Postgres. 1s is generous for a
# local/same-network Redis; tune this down further in production.
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s

# --- Kafka (Milestone 3) ---
# Only the broker address lives here — KafkaConfig builds the actual
# producer/consumer/listener setup in code (see that class for why),
# so there's one place to look, not properties and code disagreeing.
spring.kafka.bootstrap-servers=localhost:9092

# Two @Scheduled jobs share Spring's scheduler: the 30s reconciliation run
# and PublishAckRecorder's 500ms batch flush. The default pool is ONE
# thread, so a slow reconciliation run would delay the flush (and vice
# versa). Two threads let them run independently.
spring.task.scheduling.pool.size=2